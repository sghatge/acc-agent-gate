[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acc-agent-gate"
version = "0.2.0"
description = "Fail-closed governance MCP server for Adobe Campaign agent operations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sangram Ghatge" }]
dependencies = [
  "PyYAML>=6.0",
  "mcp>=1.9,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
acc-agent-gate-mcp = "acc_agent_gate.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acc_agent_gate*"]
