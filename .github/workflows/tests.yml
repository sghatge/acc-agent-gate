name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile deployment smoke test
        run: python -m py_compile scripts/opsforge_hosted_smoke.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Build API container image
        run: docker build --tag opsforge-agent-api:test .
